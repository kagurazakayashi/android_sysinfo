plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.buildinfo'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.buildinfo"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
